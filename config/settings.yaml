database:
  pool_pre_ping: true

market:
  default_symbol: EURUSD
  default_timeframe: M15
  sample_file: data/sample/EURUSD_M15_sample.csv

tradingview:
  webhook_enabled: true
  secret_header: X-TradingView-Secret
  allow_payload_secret: true

cot:
  enabled: true
  # Official CFTC Public Reporting Environment, TFF Futures Only dataset.
  url: https://www.cftc.gov/dea/newcot/FinFutWk.txt
  limit: 5000
  timeout_seconds: 30

risk:
  live_trading_enabled: false

paper_trading:
  enabled: true

pagination:
  default_limit: 100
  max_limit: 1000

phase_1b:
  supported_timeframes: [M1, M5, M15, M30, H1, H4, D1]
  swing_left_bars: 2
  swing_right_bars: 2
  break_mode: CLOSE_BREAK
  equal_level_tolerance_points: 3
  point_size: 0.00001
  minimum_rejection_ratio: 0.15

sessions:
  timezone: UTC
  asia: ["00:00", "09:00"]
  london: ["07:00", "16:00"]
  new_york: ["13:00", "22:00"]

market_regime:
  structure_weights:
    D1: 0.40
    H4: 0.30
    H1: 0.20
    M15: 0.10
  ltf_weights:
    M15: 0.60
    M5: 0.25
    M1: 0.15

institutional_mtf:
  cot_market_mapping:
    EURUSD: EURO FX

market_data:
  symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD, XAUUSD]
  timeframes: [D1, H4, H1, M30, M15, M5, M1]
  sample_sources: [local_csv]
  freshness_threshold_seconds:
    M1: 180
    M5: 900
    M15: 2700
    M30: 5400
    H1: 10800
    H4: 43200
    D1: 259200
  readiness_recent_candles: 5000

phase_3:
  calculation_version: phase3.v1
  timeframe_weights:
    D1: 0.30
    H4: 0.24
    H1: 0.18
    M30: 0.10
    M15: 0.08
    M5: 0.06
    M1: 0.04
  swing_left_bars: 2
  swing_right_bars: 2
  minimum_swing_distance: 1
  minimum_swing_price_move: 0
  break_mode: CLOSE_BREAK
  equal_level_tolerance_points: 3
  point_size: 0.00001
  minimum_rejection_ratio: 0.15
  minimum_fvg_size: 0
  order_block_lookback: 5
  displacement_atr_ratio: 1.5
  displacement_body_ratio: 0.60
  rsi_period: 14
  adx_period: 14
  atr_period: 14
  tenkan_period: 9
  kijun_period: 26
  senkou_b_period: 52
  volatility_period: 20
  abnormal_spread_ratio: 0.001

phase_4:
  base_timeframe: M15
  timeframes: [D1, H4, H1, M30, M15, M5]
  feature_version: phase4.features.v1
  label_version: phase4.labels.v1
  classification_threshold: 0.0005
  outcome_threshold: 0.001
  train_ratio: 0.70
  validation_ratio: 0.15
  minimum_samples: 1000

phase_5:
  learning_rate: 0.01
  batch_size: 32
  epochs: 100
  hidden_layers: 1
  hidden_units: 32
  dropout: 0.10
  early_stopping: true
  early_stopping_patience: 10
  minimum_improvement: 0.0001
  random_seed: 42
  class_weighting: true
  overfitting_loss_gap: 0.20
  calibration_bins: 10
  minimum_dataset_samples: 1000

phase_6:
  strategy_version: phase6.strategy.v1
  timezone: UTC
  ready_score: 65
  simulation_score: 75
  even_hour_entry_enabled: false
  scoring_weights:
    structure_alignment: 0.22
    liquidity_alignment: 0.18
    mtf_alignment: 0.22
    indicator_alignment: 0.12
    nn_alignment: 0.10
    volatility_quality: 0.08
    session_quality: 0.08
  risk:
    max_position_size: 1.0
    max_dca_entries: 3
    max_total_exposure: 3.0
    max_drawdown_allowed: 0.02
  transaction_costs:
    spread: 0.0001
    commission: 0.0
    slippage: 0.00002

phase_7:
  quote_cache_ttl_seconds: 5
  candle_cache_ttl_seconds: 30
  provider_metadata_ttl_seconds: 300
  polling_interval_seconds: 60
  high_impact_news_filter: true
  snapshot_timeframes: [D1, H4, H1, M30, M15, M5]

phase_8:
  initial_balance: 1000
  environment: PAPER
  fallback_spread: 0.0001
  fixed_slippage: 0.00002
  percentage_slippage: 0
  volatility_slippage_multiplier: 0.05
  commission_per_trade: 0
  commission_percentage: 0
  max_position_size: 10
  max_notional: 100000
  max_account_risk: 0.02
  max_dca_entries: 3
  dca_spacing: 0.001
  dca_size_multiplier: 1.0
  max_total_exposure: 100000
  max_drawdown: 0.20
  daily_loss_limit: 0.03
  max_concurrent_positions: 3

phase_9:
  dashboard_max_age_seconds: 300
  poll_interval_seconds: 10
  orchestration:
    # Disabled by default. The loop only ever reaches the paper engine, but it is
    # opt-in so that starting the API never starts trading activity on its own.
    enabled: false
    symbols: [EURUSD]
    interval_seconds: 60
    fixed_position_size: 0.1
    model_version: null
    model_registry_path: data/models
    restore_paper_state_on_start: true

phase_10:
  broker: Exness
  environment: DEMO
  timeframes: [D1, H4, H1, M30, M15, M5]
  default_candle_count: 500
  # Canonical names only. Broker suffixes/prefixes are discovered, never hardcoded.
  canonical_symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD, XAUUSD]
  tick_stale_seconds: 30
  candle_stale_multiplier: 3
  spread:
    average_window: 50
    elevated_ratio: 1.5
    extreme_ratio: 3.0
  source_comparison:
    price_tolerance: 0.0010
    timestamp_tolerance_seconds: 120

phase_11:
  environment: DEMO
  # Server names that identify a DEMO account. A server matching none of these
  # blocks execution even when every flag is open.
  demo_server_patterns: [demo, trial, practice, test]
  max_volume: 0.10
  min_volume: 0.01
  volume_step: 0.01
  max_open_positions: 3
  max_dca_entries: 3
  max_spread: 0.0005
  max_daily_drawdown: 0.03
  max_exposure: 10000
  min_stop_distance: 0.0005
  allowed_sessions: [ASIA, LONDON, NEW_YORK, LONDON_NEW_YORK_OVERLAP]
  price_deviation_tolerance: 0.0020
  reconciliation:
    volume_tolerance: 0.0001
    price_tolerance: 0.0010

phase_12:
  symbols: [EURUSD]
  timeframes: [D1, H4, H1, M30, M15, M5]
  minimum_candles: 60
  freshness_multiplier: 3
  tick_stale_seconds: 30
  # A unified regime needs agreement across the higher timeframes; M5 alone
  # can never set it. See docs/live_market_validation.md.
  regime_weights:
    D1: 0.32
    H4: 0.26
    H1: 0.20
    M30: 0.10
    M15: 0.08
    M5: 0.04
  regime_strong_threshold: 0.60
  regime_directional_threshold: 0.20
  htf_authority: [D1, H4, H1]
  ltf_setup: [M30, M15, M5]
  dca:
    max_levels: 3
    spacing: 0.0015
    size_multiplier: 1.0
    risk_per_level: 0.005
  time_exit:
    checkpoint_hours: 2
    max_holding_hours: 8
    counter_trend_min_confidence: 0.75
  spread_alert_ratio: 3.0

phase_13:
  feature_version: features_v1
  label_version: labels_v1
  preprocessing_version: scaler_v1
  # Horizons are bar counts per timeframe, resolved from the base timeframe.
  horizons: [5m, 15m, 30m, 1h, 2h, 4h, 8h, 24h]
  default_horizon: 1h
  base_timeframe: M5
  classification_threshold: 0.0005
  split:
    train_ratio: 0.70
    validation_ratio: 0.15
  walk_forward:
    initial_train_size: 200
    validation_size: 50
    test_size: 50
    step_size: 50
    minimum_windows: 3
  costs:
    spread_multiplier: 1.0
    slippage: 0.00002
    commission: 0.0
    swap_per_day: 0.0
  minimum_observations: 200
  minimum_samples_for_edge: 100
  bootstrap_samples: 1000
  confidence_level: 0.95
  drift:
    feature_psi_threshold: 0.20
    prediction_psi_threshold: 0.15
    performance_drop_threshold: 0.10
  thresholds:
    minimum_confidence: 0.55
    minimum_probability: 0.55
    minimum_expected_return: 0.0005
    maximum_expected_mae: 0.0030
  retraining:
    minimum_new_observations: 500
    scheduled_interval_days: 7
    performance_degradation: 0.10
  artifacts_path: data/models

phase_14:
  # Section 2: the scheduler accepts only these intervals.
  allowed_intervals: [60, 300, 900, 1800, 3600]
  interval_seconds: 300
  symbols: [EURUSD]
  timeframe: M5
  horizon: 1h
  max_consecutive_errors: 5
  resolve_batch: 200
  # How many missed intervals before data counts as stale / an observation times out.
  stale_after_cycles: 3
  # Section 16: at or above this confidence a wrong prediction is a HIGH_CONFIDENCE_FAILURE.
  high_confidence_threshold: 0.75
  # Sections 17-19: a segment below this many samples is never called reliable.
  segment_minimum_samples: 30
  # Mean confidence minus observed accuracy; above this the segment is overconfident.
  calibration_gap_threshold: 0.20
  rolling_windows: [7, 14, 30, 60, 90]
  rolling_minimum_samples: 20
  edge:
    minimum_samples: 100
    minimum_segment_samples: 20
    periods: 3
  # Section 11. automatic_training is not listed here: it lives in Settings and is
  # refused at startup, so YAML alone can never enable it.
  triggers:
    minimum_new_observations: 500
    scheduled_training: false
    manual_training: true
    drift_detected: true
    performance_degradation: 0.10

phase_15:
  # Sample floors. A study below its floor reports its numbers but is never
  # treated as evidence.
  minimum_samples: 100
  matrix_minimum_samples: 30
  event_minimum_samples: 30
  weight_minimum_samples: 50
  # Significance. minimum_effect is Cohen's d: statistically separable is not
  # the same as economically meaningful.
  alpha: 0.05
  minimum_effect: 0.20
  bootstrap_samples: 1000
  holdout:
    # The most recent slice is reserved and read once.
    ratio: 0.20
    budget: 1
  dca:
    # How much worse the tail may get before a DCA arm is rejected outright.
    tail_tolerance: 0.20
  reports_path: reports/research

phase_16:
  # Controlled DEMO trading. Every number here is a deliberately conservative
  # default, not an optimised one: none of these values was fitted to the test
  # set, and none should be. See docs/demo_risk_limits.md.
  environment: DEMO
  default_mode: OBSERVATION
  timezone: UTC
  trading_day_reset_hour: 0
  proposal_ttl_seconds: 900
  limits:
    max_risk_per_trade: 0.005
    max_daily_loss: 0.02
    max_total_drawdown: 0.05
    max_open_positions: 2
    max_symbol_exposure: 5000.0
    max_total_exposure: 10000.0
    max_dca_levels: 2
    max_total_dca_exposure: 7500.0
    max_trades_per_day: 5
    max_spread: 0.0005
    max_slippage: 0.0003
    max_margin_usage: 0.30
    max_position_size: 0.05
    min_volume: 0.01
    volume_step: 0.01
    min_stop_distance: 0.0005
  model:
    # The NN is advisory. These thresholds decide whether its opinion is strong
    # enough to be allowed to contribute, never whether a gate may be skipped.
    minimum_confidence: 0.60
    minimum_direction_probability: 0.60
    require_prediction: false
  strategy:
    # Only the validated Champion Strategy may execute automatically.
    allow_challenger_execution: false
    allow_experimental_execution: false
    executable_statuses: [CHAMPION]
  emergency:
    max_execution_errors: 3
    max_consecutive_reconciliation_failures: 1
    connection_failure_threshold: 3
    data_stale_seconds: 180
  symbol:
    # Broker contract facts used by position sizing when the terminal cannot be
    # asked. Sizing refuses rather than guessing when neither source has them.
    default:
      contract_size: 100000.0
      tick_size: 0.00001
      tick_value: 1.0
      digits: 5
    XAUUSD:
      contract_size: 100.0
      tick_size: 0.01
      tick_value: 1.0
      digits: 2
  comparison:
    # Paper vs DEMO: how far apart the two may be before it is worth reporting.
    entry_tolerance: 0.0002
    exit_tolerance: 0.0002
    slippage_tolerance: 0.0003

phase_17:
  # DEMO validation and shadow trading. Every threshold here decides whether a
  # claim is allowed to be made, never whether an order may be sent.
  environment: DEMO
  shadow:
    # Cost model for a signal that was never executed. Deliberately not free:
    # an expected move smaller than these is not an expected profit.
    spread: 0.0001
    slippage_estimate: 0.00002
    commission: 0.0
  comparison:
    entry_tolerance: 0.0002
    exit_tolerance: 0.0002
    slippage_tolerance: 0.0003
    spread_tolerance: 0.0002
    cost_tolerance: 0.5
    time_tolerance_seconds: 60
    minimum_samples: 30
  minimums:
    # Section 16. An edge is never declared from a tiny sample.
    minimum_signals: 100
    minimum_winning_signals: 20
    minimum_losing_signals: 20
    minimum_regime_samples: 30
    minimum_session_samples: 30
    minimum_timeframe_samples: 30
  edge:
    # Below this, expectancy is indistinguishable from zero after cost.
    minimum_expectancy: 0.0
  gates:
    # Section 17. A failed gate reports; it never enables higher-risk execution.
    minimum_samples: 100
    maximum_drawdown: 0.05
    minimum_expectancy: 0.0
    minimum_profit_factor: 1.10
    maximum_rejection_rate: 0.10
    maximum_reconciliation_failure_rate: 0.0
    maximum_high_confidence_failure_rate: 0.30
    minimum_calibration_quality: 0.80
  even_hour:
    minimum_samples: 30
    # Below this the difference is noise dressed as a result.
    minimum_effect: 0.0001
  dca:
    minimum_samples: 30
    # How much worse the tail may get before a win-rate gain is rejected.
    tail_tolerance: 0.20
  circuit_breaker:
    max_execution_failures: 3
    data_stale_seconds: 180
    # A spread this many times the configured maximum is abnormal, not merely wide.
    abnormal_spread_ratio: 2.0
  anomaly:
    frequency_threshold: 0.50
    spread_threshold: 0.50
    slippage_threshold: 0.50
    distribution_threshold: 0.20
    latency_threshold: 1.00
    connectivity_threshold: 0
  review:
    timezone: UTC
