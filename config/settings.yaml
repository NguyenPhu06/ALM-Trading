database:
  pool_pre_ping: true

market:
  default_symbol: EURUSD
  default_timeframe: M15
  sample_file: data/sample/EURUSD_M15_sample.csv

tradingview:
  webhook_enabled: true
  secret_header: X-TradingView-Secret
  allow_payload_secret: true

cot:
  enabled: true
  # Official CFTC Public Reporting Environment, TFF Futures Only dataset.
  url: https://www.cftc.gov/dea/newcot/FinFutWk.txt
  limit: 5000
  timeout_seconds: 30

risk:
  live_trading_enabled: false

paper_trading:
  enabled: true

pagination:
  default_limit: 100
  max_limit: 1000

phase_1b:
  supported_timeframes: [M1, M5, M15, M30, H1, H4, D1]
  swing_left_bars: 2
  swing_right_bars: 2
  break_mode: CLOSE_BREAK
  equal_level_tolerance_points: 3
  point_size: 0.00001
  minimum_rejection_ratio: 0.15

sessions:
  timezone: UTC
  asia: ["00:00", "09:00"]
  london: ["07:00", "16:00"]
  new_york: ["13:00", "22:00"]

market_regime:
  structure_weights:
    D1: 0.40
    H4: 0.30
    H1: 0.20
    M15: 0.10
  ltf_weights:
    M15: 0.60
    M5: 0.25
    M1: 0.15

institutional_mtf:
  cot_market_mapping:
    EURUSD: EURO FX

market_data:
  symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD, XAUUSD]
  timeframes: [D1, H4, H1, M30, M15, M5, M1]
  sample_sources: [local_csv]
  freshness_threshold_seconds:
    M1: 180
    M5: 900
    M15: 2700
    M30: 5400
    H1: 10800
    H4: 43200
    D1: 259200
  readiness_recent_candles: 5000

phase_3:
  calculation_version: phase3.v1
  timeframe_weights:
    D1: 0.30
    H4: 0.24
    H1: 0.18
    M30: 0.10
    M15: 0.08
    M5: 0.06
    M1: 0.04
  swing_left_bars: 2
  swing_right_bars: 2
  minimum_swing_distance: 1
  minimum_swing_price_move: 0
  break_mode: CLOSE_BREAK
  equal_level_tolerance_points: 3
  point_size: 0.00001
  minimum_rejection_ratio: 0.15
  minimum_fvg_size: 0
  order_block_lookback: 5
  displacement_atr_ratio: 1.5
  displacement_body_ratio: 0.60
  rsi_period: 14
  adx_period: 14
  atr_period: 14
  tenkan_period: 9
  kijun_period: 26
  senkou_b_period: 52
  volatility_period: 20
  abnormal_spread_ratio: 0.001

phase_4:
  base_timeframe: M15
  timeframes: [D1, H4, H1, M30, M15, M5]
  feature_version: phase4.features.v1
  label_version: phase4.labels.v1
  classification_threshold: 0.0005
  outcome_threshold: 0.001
  train_ratio: 0.70
  validation_ratio: 0.15
  minimum_samples: 1000

phase_5:
  learning_rate: 0.01
  batch_size: 32
  epochs: 100
  hidden_layers: 1
  hidden_units: 32
  dropout: 0.10
  early_stopping: true
  early_stopping_patience: 10
  minimum_improvement: 0.0001
  random_seed: 42
  class_weighting: true
  overfitting_loss_gap: 0.20
  calibration_bins: 10
  minimum_dataset_samples: 1000

phase_6:
  strategy_version: phase6.strategy.v1
  timezone: UTC
  ready_score: 65
  simulation_score: 75
  even_hour_entry_enabled: false
  scoring_weights:
    structure_alignment: 0.22
    liquidity_alignment: 0.18
    mtf_alignment: 0.22
    indicator_alignment: 0.12
    nn_alignment: 0.10
    volatility_quality: 0.08
    session_quality: 0.08
  risk:
    max_position_size: 1.0
    max_dca_entries: 3
    max_total_exposure: 3.0
    max_drawdown_allowed: 0.02
  transaction_costs:
    spread: 0.0001
    commission: 0.0
    slippage: 0.00002

phase_7:
  quote_cache_ttl_seconds: 5
  candle_cache_ttl_seconds: 30
  provider_metadata_ttl_seconds: 300
  polling_interval_seconds: 60
  high_impact_news_filter: true
  snapshot_timeframes: [D1, H4, H1, M30, M15, M5]

phase_8:
  initial_balance: 1000
  environment: PAPER
  fallback_spread: 0.0001
  fixed_slippage: 0.00002
  percentage_slippage: 0
  volatility_slippage_multiplier: 0.05
  commission_per_trade: 0
  commission_percentage: 0
  max_position_size: 10
  max_notional: 100000
  max_account_risk: 0.02
  max_dca_entries: 3
  dca_spacing: 0.001
  dca_size_multiplier: 1.0
  max_total_exposure: 100000
  max_drawdown: 0.20
  daily_loss_limit: 0.03
  max_concurrent_positions: 3

phase_9:
  dashboard_max_age_seconds: 300
  poll_interval_seconds: 10
  orchestration:
    # Disabled by default. The loop only ever reaches the paper engine, but it is
    # opt-in so that starting the API never starts trading activity on its own.
    enabled: false
    symbols: [EURUSD]
    interval_seconds: 60
    fixed_position_size: 0.1
    model_version: null
    model_registry_path: data/models
    restore_paper_state_on_start: true

phase_10:
  broker: Exness
  environment: DEMO
  timeframes: [D1, H4, H1, M30, M15, M5]
  default_candle_count: 500
  # Canonical names only. Broker suffixes/prefixes are discovered, never hardcoded.
  canonical_symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD, XAUUSD]
  tick_stale_seconds: 30
  candle_stale_multiplier: 3
  spread:
    average_window: 50
    elevated_ratio: 1.5
    extreme_ratio: 3.0
  source_comparison:
    price_tolerance: 0.0010
    timestamp_tolerance_seconds: 120

phase_11:
  environment: DEMO
  # Server names that identify a DEMO account. A server matching none of these
  # blocks execution even when every flag is open.
  demo_server_patterns: [demo, trial, practice, test]
  max_volume: 0.10
  min_volume: 0.01
  volume_step: 0.01
  max_open_positions: 3
  max_dca_entries: 3
  max_spread: 0.0005
  max_daily_drawdown: 0.03
  max_exposure: 10000
  min_stop_distance: 0.0005
  allowed_sessions: [ASIA, LONDON, NEW_YORK, LONDON_NEW_YORK_OVERLAP]
  price_deviation_tolerance: 0.0020
  reconciliation:
    volume_tolerance: 0.0001
    price_tolerance: 0.0010
