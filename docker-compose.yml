services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TRADINGVIEW_WEBHOOK_SECRET: ${TRADINGVIEW_WEBHOOK_SECRET:?TRADINGVIEW_WEBHOOK_SECRET is required}
      LIVE_TRADING_ENABLED: "false"
      DEMO_TRADING_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-historical}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_BASE_URL: ${MARKET_DATA_BASE_URL:-https://api.twelvedata.com}
      MARKET_DATA_TIMEOUT: ${MARKET_DATA_TIMEOUT:-30}
      MARKET_DATA_RATE_LIMIT: ${MARKET_DATA_RATE_LIMIT:-8}
      MARKET_DATA_MAX_RETRIES: ${MARKET_DATA_MAX_RETRIES:-3}
      MARKET_DATA_BACKOFF_SECONDS: ${MARKET_DATA_BACKOFF_SECONDS:-1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
