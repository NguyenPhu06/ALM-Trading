services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TRADINGVIEW_WEBHOOK_SECRET: ${TRADINGVIEW_WEBHOOK_SECRET:?TRADINGVIEW_WEBHOOK_SECRET is required}
      LIVE_TRADING_ENABLED: "false"
      DEMO_TRADING_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-historical}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_BASE_URL: ${MARKET_DATA_BASE_URL:-https://api.twelvedata.com}
      MARKET_DATA_TIMEOUT: ${MARKET_DATA_TIMEOUT:-30}
      MARKET_DATA_RATE_LIMIT: ${MARKET_DATA_RATE_LIMIT:-8}
      MARKET_DATA_MAX_RETRIES: ${MARKET_DATA_MAX_RETRIES:-3}
      MARKET_DATA_BACKOFF_SECONDS: ${MARKET_DATA_BACKOFF_SECONDS:-1}
      # Phase 10: MT5 is read-only and DEMO-only. The MetaTrader5 package is
      # Windows-only, so this Linux container reports MT5_TERMINAL_NOT_AVAILABLE
      # unless a Windows read-only bridge is configured. See docs/mt5_windows_bridge.md.
      TRADING_ENVIRONMENT: "DEMO"
      READ_ONLY_MODE: "true"
      MT5_READ_ONLY: "false"
      MT5_EXECUTION_ENABLED: "false"
      MT5_ENABLED: ${MT5_ENABLED:-false}
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_BROKER: ${MT5_BROKER:-Exness}
      MT5_BRIDGE_URL: ${MT5_BRIDGE_URL:-}
      # Phase 11: DEMO execution gates. All closed here; opening them is a
      # deliberate, manual act on a verified DEMO account only.
      DEMO_TRADING_ENABLED: "false"
      EXECUTION_KILL_SWITCH: "true"
      DEMO_EXECUTION_MAX_VOLUME: ${DEMO_EXECUTION_MAX_VOLUME:-0.10}
      # Phase 12: observe the live market, send nothing. The outermost block.
      OBSERVATION_MODE: "true"
      OBSERVATION_SYMBOLS: ${OBSERVATION_SYMBOLS:-EURUSD}
      OBSERVATION_INTERVAL_SECONDS: ${OBSERVATION_INTERVAL_SECONDS:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
